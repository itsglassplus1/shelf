# shelf with Docker Compose.
#
#   docker compose up -d

services:
  shelf:
    image: ghcr.io/itsglassplus1/shelf:latest
    container_name: shelf
    restart: on-failure:3

    # shelf speaks plain HTTP. Outside a trusted network, put a reverse proxy
    # with TLS in front and publish the port to it only ("127.0.0.1:25600:25600").
    ports:
      - "25600:25600"

    environment:
      # Category folders inside the library, separated by ":". Each one
      # becomes a library in the extension. See the README for the others.
      SHELF_CATEGORIES: "comics:manga"

      # Suwayomi in the same file can reach shelf at http://shelf:25600. If
      # nothing else can reach shelf (no "ports" above), the login can be turned
      # off with:
      # SHELF_AUTH: "off"

    volumes:
      # The library, read only. On SELinux hosts (Fedora, RHEL) add z: ":ro,z".
      - /path/to/library:/library:ro
      # shelf's own files: login, unpacked RAR chapters, cover and
      # ComicInfo.xml copies. Create this directory beforehand, owned by uid
      # 1000 (or whatever you set user to). On SELinux hosts add ":z". The
      # login info is in shelf-data/credentials, created on first start.
      - ./shelf-data:/data

    # shelf runs as uid and gid 1000, usually the host's first user. The
    # library must be readable by it. To run as someone else:
    # user: "1001:1001"

    # shelf only writes to /data and needs no privileges: the rest of the
    # container is read only, it has no capabilities, and can't gain any.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
