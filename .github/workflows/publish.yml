# Builds and tests the image; publishes it to ghcr.io/<owner>/<repo> only
# for version tags and manual runs.
#
#   push tag v1.2.3   -> :1.2.3 :1.2 :1 :latest
#   manual run        -> :<branch>    (e.g. :main, a development build)
#   push to main      -> built and tested, not published
#   pull request      -> built and tested, not published
#
# The Containerfile runs `go test`, so a failing test fails this workflow and
# nothing is published.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to ghcr.io with GITHUB_TOKEN
      attestations: write # build provenance
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # ghcr.io image names must be lowercase; the repository name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # :latest is added for version tags only (the default "auto").

      - name: Build, test and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
